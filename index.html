<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Poppins:400,500,600,700,800,900"
      rel="stylesheet"
    />
    <title>Weather App</title>
  </head>
  <body>
    <!-- SEARCH BAR -->
    <main>
      <search class="search-container">
        <form action="/search" method="GET">
          <input
            class="search-input"
            id="search-input"
            type="search"
            name="search-city"
            placeholder="Enter the city name..."
            aria-label="Search city"
          />
          <button type="submit" id="search-button">
            <img src="images/search.png" alt="search-button" />
          </button>
        </form>
      </search>

      <!-- MAIN BODY: weather icon, temp, conditions -->
      <section aria-label="Current weather">
        <!-- WEATHER MAIN -->
        <div class="weather-main">
          <img src="images/clouds.png" alt="" id="weather-main-icon" />
          <p id="temperature">Temp<!-- TEMPERATURE --></p>
          <p id="city">City<!-- CITY --></p>
        </div>

        <!-- WEATHER DETAILS -->
        <div class="weather-details">
          <!-- Humidity Section -->
          <div class="humidity">
            <img src="images/humidity.png" alt="" class="weather-image" />
            <div class="weather-text">
              <p class="weather-value" id="humidity-level">56%</p>
              <p class="weather-label">Humidity</p>
            </div>
          </div>

          <!-- Wind Section -->
          <div class="wind">
            <img src="images/wind.png" alt="" class="weather-image" />
            <div class="weather-text">
              <p class="weather-value" id="wind-speed">67.69 km/h</p>
              <p class="weather-label">Wind Speed</p>
            </div>
          </div>
        </div>
        <!---->
      </section>
    </main>
    <script src="config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
